# Tiny end-to-end smoke config for the switch model (switch_model_plan.md).
# Same simulation block as experiments/smoke/config.yaml (K = 3 catalogue
# signatures, one always-on pair plus one switching unit), plus an
# inference.switching block. inference.model is 'fixed' by default, but
# num_signatures is also set so the same config can be run through
# run_inference.run_denovo() directly (as tests/test_smoke_switch.py does),
# matching how tests/test_smoke.py exercises experiments/smoke/config.yaml.
# Not a scientific run: exercised by tests/test_smoke_switch.py; run it
# manually the same way as any other config:
#
#   cd scripts
#   python generate_data.py --config ../experiments/smoke_switch/config.yaml
#   python run_inference.py --config ../experiments/smoke_switch/config.yaml
#   python recovery_vs_truth.py --trace ../experiments/smoke_switch/results/trace.nc \
#       --true-activities ../experiments/smoke_switch/data/true_activities.csv \
#       --newick ../experiments/smoke_switch/data/newick_string.nwk \
#       --metrics cosine tv --outdir ../experiments/smoke_switch/results/recovery

experiment_name: smoke_switch
experiment_root: ../experiments/
git_tag: treehdp-v2

simulation:
  seed: 20240607 # matches tests/conftest.py's RNG_SEED
  make_plots: false

  repertoire:
    source: cosmic
    path: ../COSMIC_sig/cosmic_signatures.csv
    signatures: [SBS1, SBS5, SBS36]

  switching:
    enabled: true
    branch_length_scaling: true
    units:
      - signatures: [SBS1] # clock: always on
        root_prob: 1.0
        lambda_on: 0.0
        lambda_off: 0.0
      - signatures: [SBS5] # clock: always on
        root_prob: 1.0
        lambda_on: 0.0
        lambda_off: 0.0
      - signatures: [SBS36] # the one switching unit
        root_prob: 0.3
        lambda_on: 0.6
        lambda_off: 0.3

  levels:
    enabled: true
    walk: dirichlet
    concentration: 50.0
    branch_length_scaling: true
    concentration_floor: 1.0
    root_concentration: 1.0
    activation_pseudocount: 0.02

  forest:
    n_trees: 2
    nodes_per_tree: [4, 8]
    depth: [2, 4]
    max_attempts: 200
    branch_lengths:
      distribution: lognormal
      params: { mu: 0.0, sigma: 0.6 }

  burden:
    mean: 300
    distribution: negbin
    dispersion: 2.0

  counts:
    model: dirichlet_multinomial
    kappa: 50.0

inference:
  model: fixed
  num_signatures: 3 # so the same config also runs denovo (see header)

  data:
    count_matrix: ../experiments/smoke_switch/data/mutation_count_matrix.csv
    newick_string: ../experiments/smoke_switch/data/newick_string.nwk
    tree_edges: ../experiments/smoke_switch/data/tree_edges.csv
    fixed_signatures: ../experiments/smoke_switch/data/fixed_signatures.csv
    true_activities: ../experiments/smoke_switch/data/true_activities.csv
    ground_truth_params: ../experiments/smoke_switch/data/ground_truth_params.json

  priors:
    sigma_prior: LogNorm
    sigma_prior_parm:
      mu: 0.0
      sigma: 1.0
    sigma_0: 1.0
    sigma_mu: 2.0
    beta: 0.5

  switching:
    enabled: true
    branch_length_source: newick
    lambda_on_prior: LogNorm
    lambda_on_prior_parm:
      mu: -1.2
      sigma: 1.0
    lambda_off_prior: LogNorm
    lambda_off_prior_parm:
      mu: -1.2
      sigma: 1.0
    pi_root_prior: Beta
    pi_root_prior_parm:
      alpha: 1
      beta: 1

  draws: 50
  tune: 100
  chains: 1
  cores: 1
  target_accept: 0.9
  max_treedepth: 10
