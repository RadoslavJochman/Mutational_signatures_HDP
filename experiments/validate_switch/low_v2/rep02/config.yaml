# generated by make_replicate_configs.py from ../experiments/validate_switch/base_low_v2.yaml
# replicate 2, seed 20260920, setting low_v2
experiment_name: validate_switch/low_v2/rep02
experiment_root: ../experiments/
git_tag: treehdp-v2-rc1
simulation:
  seed: 20260920
  make_plots: false
  repertoire:
    source: cosmic
    path: ../COSMIC_sig/cosmic_signatures.csv
    signatures:
    - SBS1
    - SBS5
    - SBS36
    - SBS112
    - SBS40a
  switching:
    enabled: true
    branch_length_scaling: true
    units:
    - signatures:
      - SBS1
      root_prob: 1.0
      lambda_on: 0.0
      lambda_off: 0.0
    - signatures:
      - SBS5
      root_prob: 1.0
      lambda_on: 0.0
      lambda_off: 0.0
    - signatures:
      - SBS36
      - SBS112
      root_prob: 0.0
      lambda_on: 0.4
      lambda_off: 0.1
    - signatures:
      - SBS40a
      root_prob: 0.5
      lambda_on: 0.05
      lambda_off: 0.05
  levels:
    enabled: true
    walk: dirichlet
    concentration: 50.0
    branch_length_scaling: true
    concentration_floor: 1.0
    root_concentration: 1.0
    activation_pseudocount: 0.02
  forest:
    n_trees: 4
    nodes_per_tree:
    - 6
    - 10
    depth:
    - 2
    - 4
    max_attempts: 200
    branch_lengths:
      distribution: lognormal
      params:
        mu: 0.0
        sigma: 0.6
  burden:
    mean: 300
    distribution: negbin
    dispersion: 2.0
  counts:
    model: dirichlet_multinomial
    kappa: 50.0
inference:
  model: fixed
  data:
    count_matrix: ../experiments/validate_switch/low_v2/rep02/data/mutation_count_matrix.csv
    newick_string: ../experiments/validate_switch/low_v2/rep02/data/newick_string.nwk
    tree_edges: ../experiments/validate_switch/low_v2/rep02/data/tree_edges.csv
    fixed_signatures: ../experiments/validate_switch/low_v2/rep02/data/fixed_signatures.csv
    true_activities: ../experiments/validate_switch/low_v2/rep02/data/true_activities.csv
    ground_truth_params: ../experiments/validate_switch/low_v2/rep02/data/ground_truth_params.json
  priors:
    sigma_prior: LogNorm
    sigma_prior_parm:
      mu: 0.0
      sigma: 1.0
    sigma_0: 1.0
    sigma_mu: 2.0
    walk_branch_length_scaling: false
  switching:
    enabled: true
    branch_length_source: newick
    lambda_on_prior: LogNorm
    lambda_on_prior_parm:
      mu: -1.2
      sigma: 1.0
    lambda_off_prior: LogNorm
    lambda_off_prior_parm:
      mu: -1.2
      sigma: 1.0
    pi_root_prior: Beta
    pi_root_prior_parm:
      alpha: 1
      beta: 1
    always_on: []
    tree_coupled: true
  draws: 1000
  tune: 1000
  chains: 4
  cores: 4
  target_accept: 0.9
  max_treedepth: 10
