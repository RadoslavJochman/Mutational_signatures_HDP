# ==========================================================================
#  EXPERIMENT: Tree-HDP de novo discovery -- OU activity prior, correlation 0.3, eight chains
# ==========================================================================
#
#  Model structure : denovo-v2  (Ornstein-Uhlenbeck activity prior)
#  Git tag         : denovo-v2
#
#  PURPOSE
#    The controlled test of the OU prior. Same correlation-0.3 data as
#    config_denovo_easy_more_chains_corr_0.3.yaml, the same signature prior,
#    the same walk scale and root spread, the same sampler. The ONLY change
#    is the activity prior: the random walk is replaced by a mean-reverting
#    Ornstein-Uhlenbeck walk that pools every node toward a global centre mu.
#    Any change in the camps or in worst-chain recovery is therefore
#    attributable to the prior alone.
#
#    Success looks like: the two camps merge (the soft-ridge mode-lock is
#    removed) and worst-chain activity L1 to truth drops toward the
#    denovo-v1 best-chain floor. The soft floor itself should NOT vanish,
#    and the signatures, already recovered at this overlap, should stay so.
#
#  DATA
#    Reuses the corr-0.3 dataset produced by the denovo-v1 config. This
#    config is inference-only: do NOT run generate_data.py for it. Generate
#    the data once with config_denovo_easy_more_chains_corr_0.3.yaml (or point
#    the paths below at your existing run), then run the de novo runner.
#
#  RUN IT WITH THE DE NOVO RUNNER
#    The model is selected by inference.model below. The de novo runner adds
#    the post-hoc per-draw chain alignment without which r_hat / ess in the
#    summary are meaningless. For the OU model, sigma / phi / theta are
#    label-invariant scalars and their r_hat / ess are meaningful as is; mu
#    shares the signature labelling and is not aligned, so read its
#    per-component summary like eta_level_*.
#
#  HOW TO REPRODUCE
#    git checkout denovo-v2
#    # data already generated by the denovo-v1 corr-0.3 config
#    python scripts/run_unknown_inference.py --config configs/config_denovo_ou_more_chains_corr_0.3.yaml
#
#  REGRESSION FIRST (recommended before trusting any OU result)
#    Run this config once with two edits to confirm the OU walk reduces to
#    the denovo-v1 random walk and reproduces the corr-0.3 denovo-v1 result:
#        priors.mu_fixed: true
#        replace phi_prior / phi_prior_parm with   phi_fixed: 0.999
#    With mu pinned to 0 and phi ~ 1 there is no pooling; the fit should
#    match the denovo-v1 corr-0.3 run within Monte Carlo error.
#
# ==========================================================================

experiment_name: config_denovo_ou_more_chains_corr_03
git_tag: denovo-v2

# ── Data generation ─────────────────────────────────────────────────────────
simulation:
  seed: 42
  results_dir: ../data/
  make_plots: true

  # Activity walk e_j ~ Dir(alpha * e_parent) in the generator.
  alpha: 15.0
  # Non-degenerate cohort baseline (Dir(1.0)); sparsity is off for this
  # easy regime, so the baseline spreads over all signatures.
  alpha_0: 10.0

  # Generous mutation counts, de novo discovery needs signal.
  lam: 3000
  nb_dispersion: none

  # Easy regime: no sparsity, no dropout. Every signature active
  # everywhere, constant support down each tree.
  activity_sparsity: 0.0
  signature_dropout: 0.0

  # ── Signatures ────────────────────────────────────────────────────────────
  signatures:
    source: synthesize          # synthesize | load
    # correlation = 0.1 -> near-orthogonal, well-separated signatures.
    # This is the EASY setting: distinct signatures are simplest to
    # discover and to align unambiguously.
    correlation: 0.3
    path: ../COSMIC_sig/cosmic_signatures.csv   # used only when source == load
    num_signatures: 10          # K

  # ── Random phylogenetic forest ────────────────────────────────────────────
  forest:
    num_trees: 30
    min_leaves: 3
    max_leaves: 5
    min_branch_length: 2000
    max_branch_length: 5000

# ── Inference ───────────────────────────────────────────────────────────────
inference:
  # Activity prior selector: 'denovo' (random walk) or 'ou' (Ornstein-Uhlenbeck).
  model: ou
  # Branch length here is the per-node mutation-count mean, not an activity
  # drift time, and the generator's drift is constant per edge, so leave the
  # branch-length scaling off (discrete OU, one weight per edge).
  branch_length_scaling: false

  # K is known for this stage.
  num_signatures: 10

  data:
    count_matrix: ../data/config_denovo_ou_more_chains_corr_03/mutation_count_matrix.csv
    newick_string: ../data/config_denovo_ou_more_chains_corr_03/newick_string.nwk
    tree_edges: ../data/config_denovo_ou_more_chains_corr_03/tree_edges.csv
    fixed_signatures: ../data/config_denovo_ou_more_chains_corr_03/fixed_signatures.csv
    true_activities: ../data/config_denovo_ou_more_chains_corr_03/true_activities.csv
    ground_truth_params: ../data/config_denovo_ou_more_chains_corr_03/ground_truth_params.json

  priors:
    sigma_prior: LogNorm
    sigma_prior_parm:
      mu: 0.0
      sigma: 1.0
    # Root-baseline std: eta_root = mu + sigma_0 * z.
    sigma_0: 2.0
    # Signature prior S_k ~ Dir(beta * 1_96). Single shared concentration.
    beta: 0.5

    # Global pooling centre mu (the shared cohort baseline, in logit space).
    # mu_fixed: true pins mu = 0 for the regression / no-pooling baseline.
    mu_fixed: false
    mu_tau: 2.0           # mu ~ Normal(0, mu_tau^2); matched to sigma_0
    # Per-edge persistence phi in (0,1); informative prior with mass below 1.
    # phi -> 1 is the denovo-v1 random walk; smaller phi pools harder toward mu.
    # The likelihood is flat in the soft directions and will not demand
    # reversion on its own, so this prior is what supplies the pooling.
    phi_prior: Beta
    phi_prior_parm:
      alpha: 5.0          # Beta(5,2): mean 0.71, mass kept off 1
      beta: 2.0

  # NUTS sampler settings (kept identical to the denovo-v1 corr-0.3 run for
  # comparability). If mu / theta ess is poor or divergences appear, raise
  # target_accept to 0.95 and max_treedepth to 12 rather than changing the
  # data or priors.
  draws: 1000
  tune: 1000
  chains: 8
  cores: 8
  target_accept: 0.9
  max_treedepth: 10

  results_dir: ../results/