# ==========================================================================
#  EXPERIMENT: Tree-HDP de novo discovery -- OU activity prior, FIXED phi=0.5, correlation 0.3
# ==========================================================================
#
#  Model structure : denovo-v2  (Ornstein-Uhlenbeck activity prior, fixed reversion)
#  Git tag         : denovo-v2
#
#  PURPOSE
#    Decisive mechanism test. The learned-phi run collapsed to phi~0.99 (no
#    reversion), leaving a free unconstrained mu and an ill-conditioned
#    geometry near phi=1. Here phi is PINNED to 0.5 to force reversion to
#    engage. Two things should follow: mu becomes identified and the soft
#    mode is pooled (camps merge), and theta is bounded away from 0 so the
#    s_j parameterization is conditioned and mu/sigma mix.
#
#    Success: camps merge (one camp, or a soft difference far smaller than the
#    learned-phi run), worst-chain L1 to truth at or below ~0.11, tree depth
#    no longer saturated, sigma/mu ess recovered.
#
#  DATA
#    Reuses the corr-0.3 dataset from the denovo-v1 config. Inference-only:
#    do NOT run generate_data.py for this config.
#
#  RUN
#    python scripts/run_unknown_inference.py --config configs/config_denovo_ou_phi0_5_corr_0.3.yaml
#
# ==========================================================================

experiment_name: config_denovo_ou_phi_05_corr_03
git_tag: denovo-v2

# ── Data generation ─────────────────────────────────────────────────────────
simulation:
  seed: 42
  results_dir: ../data/
  make_plots: true

  # Activity walk e_j ~ Dir(alpha * e_parent) in the generator.
  alpha: 15.0
  # Non-degenerate cohort baseline (Dir(1.0)); sparsity is off for this
  # easy regime, so the baseline spreads over all signatures.
  alpha_0: 10.0

  # Generous mutation counts, de novo discovery needs signal.
  lam: 3000
  nb_dispersion: none

  # Easy regime: no sparsity, no dropout. Every signature active
  # everywhere, constant support down each tree.
  activity_sparsity: 0.0
  signature_dropout: 0.0

  # ── Signatures ────────────────────────────────────────────────────────────
  signatures:
    source: synthesize          # synthesize | load
    # correlation = 0.1 -> near-orthogonal, well-separated signatures.
    # This is the EASY setting: distinct signatures are simplest to
    # discover and to align unambiguously.
    correlation: 0.3
    path: ../COSMIC_sig/cosmic_signatures.csv   # used only when source == load
    num_signatures: 10          # K

  # ── Random phylogenetic forest ────────────────────────────────────────────
  forest:
    num_trees: 30
    min_leaves: 3
    max_leaves: 5
    min_branch_length: 2000
    max_branch_length: 5000

inference:
  model: ou
  branch_length_scaling: false
  num_signatures: 10

  data:
    count_matrix: ../data/config_denovo_ou_phi_05_corr_03/mutation_count_matrix.csv
    newick_string: ../data/config_denovo_ou_phi_05_corr_03/newick_string.nwk
    tree_edges: ../data/config_denovo_ou_phi_05_corr_03/tree_edges.csv
    fixed_signatures: ../data/config_denovo_ou_phi_05_corr_03/fixed_signatures.csv
    true_activities: ../data/config_denovo_ou_phi_05_corr_03/true_activities.csv
    ground_truth_params: ../data/config_denovo_ou_phi_05_corr_03/ground_truth_params.json

  priors:
    sigma_prior: LogNorm
    sigma_prior_parm:
      mu: 0.0
      sigma: 1.0
    sigma_0: 2.0
    beta: 0.5

    # OU pooling centre mu (learned). With phi fixed below, reversion is on,
    # so mu is identified.
    mu_fixed: false
    mu_tau: 2.0

    # Reversion PINNED: phi=0.5 per edge (no phi prior). theta = -log(0.5).
    phi_fixed: 0.5

  draws: 1000
  tune: 1000
  chains: 8
  cores: 8
  target_accept: 0.95
  max_treedepth: 12

  results_dir: ../results/
