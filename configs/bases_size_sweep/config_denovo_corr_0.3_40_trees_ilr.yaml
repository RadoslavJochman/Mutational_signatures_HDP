# Tree-HDP de novo, denovo-v1-ilr. Size-sweep base, 40 trees, correlation 0.3.
# Family differing only in forest.num_trees and experiment_name; all load the same
# frozen signature matrix so only the forest changes along the size axis. The
# replicate harness regenerates a fresh dataset per replicate and repoints the
# data paths below, so their literal values here do not matter.

experiment_name: config_denovo_corr_03_40_trees_ilr
git_tag: denovo-v1-ilr

# ── Data generation (template; the replicate harness regenerates this per replicate) ──
simulation:
  seed: 42
  results_dir: ../data/
  make_plots: true

  # Activity walk e_j ~ Dir(alpha * e_parent) in the generator.
  alpha: 15.0
  # Cohort baseline Dir(1.0); sparsity off, baseline spreads over all signatures.
  alpha_0: 10.0

  # Generous mutation counts.
  lam: 3000
  nb_dispersion: none

  # Easy regime: no sparsity, no dropout.
  activity_sparsity: 0.0
  signature_dropout: 0.0

  # ── Signatures ────────────────────────────────────────────────────────────
  signatures:
    source: load                # loads the shared corr 0.3 signature matrix
    correlation: 0.3
    path: ../data/config_denovo_corr_03_30_trees/fixed_signatures.csv
    num_signatures: 10          # K

  # ── Random phylogenetic forest ────────────────────────────────────────────
  forest:
    num_trees: 40
    min_leaves: 3
    max_leaves: 5
    min_branch_length: 2000
    max_branch_length: 5000

# ── Inference ───────────────────────────────────────────────────────────────
inference:
  # K is known for this stage. DeNovoHDP discovers this many signatures.
  num_signatures: 10

  # Per-replicate data dir, repointed per replicate by the harness.
  data:
    count_matrix: ../data/config_denovo_corr_03_40_trees_ilr/mutation_count_matrix.csv
    newick_string: ../data/config_denovo_corr_03_40_trees_ilr/newick_string.nwk
    tree_edges: ../data/config_denovo_corr_03_40_trees_ilr/tree_edges.csv
    fixed_signatures: ../data/config_denovo_corr_03_40_trees_ilr/fixed_signatures.csv
    true_activities: ../data/config_denovo_corr_03_40_trees_ilr/true_activities.csv
    ground_truth_params: ../data/config_denovo_corr_03_40_trees_ilr/ground_truth_params.json

  priors:
    # Walk-scale prior (unchanged).
    sigma_prior: LogNorm
    sigma_prior_parm:
      mu: 0.0
      sigma: 1.0
    # Root-deviation scale. NOTE: meaning changed under denovo-v1-ilr -- this is now
    # the spread of roots AROUND the cohort level mu_level, not an absolute root
    # scale, so it is smaller than the denovo-v1 value (was 2.0).
    sigma_0: 1.0
    # NEW: cohort usage-level scale. mu_level ~ ZeroSumNormal(sigma_mu), the
    # per-signature overall usage pooled across the whole forest.
    sigma_mu: 2.0
    # Signature prior S_k ~ Dir(beta * 1_96). Single shared concentration.
    beta: 0.5

  # NUTS sampler settings. Random start on purpose (no NMF init): the point is to
  # test whether the reparameterisation lets NUTS mix natively.
  draws: 6000
  tune: 3000
  chains: 8
  cores: 8
  target_accept: 0.9
  max_treedepth: 10

  results_dir: ../results/
