# ==========================================================================
#  EXPERIMENT: Tree-HDP de novo signature discovery -- eight chains
# ==========================================================================
#
#  Model structure : denovo-v1
#  Git tag         : denovo-v1
#
#  PURPOSE
#    The near orthogonal end of the signature overlap sweep. Identical to the
#    first easy run except for eight chains instead of four, so that between
#    chain mode structure can be detected and convergence judged across more
#    chains. At this low correlation the signatures are expected to be
#    recovered and the chains to broadly agree, so any activity multimodality
#    here is a sampling effect rather than a lack of identifiability. This run
#    is the 0.1 reference point for the sweep.
#
#  MODEL
#    Same logistic-normal activity walk as fixed-sig-v2.  The only addition
#    is the signature block: S_k ~ Dir(beta * 1_96), with a single shared
#    concentration beta.
#
#  RUN IT WITH THE DE NOVO RUNNER
#    De novo inference must be run with run_inference_unknown_sig.py, not
#    run_inference.py.  The de novo runner adds the post-hoc chain-
#    alignment step (per-draw alignment to chain 0) without which the
#    r_hat / ess in the summary are meaningless, they would compare
#    chains that merely ordered the same signatures differently.
#
#  HOW TO REPRODUCE
#    git checkout denovo-v1
#    python scripts/generate_data.py             --config configs/config_denovo_easy.yaml
#    python scripts/run_inference_unknown_sig.py  --config configs/config_denovo_easy.yaml
#
# ==========================================================================

experiment_name: config_denovo_easy_more_chains
git_tag: denovo-v1

# ── Data generation ─────────────────────────────────────────────────────────
simulation:
  seed: 42
  results_dir: ../data/
  make_plots: true

  # Activity walk e_j ~ Dir(alpha * e_parent) in the generator.
  alpha: 15.0
  # Non-degenerate cohort baseline (Dir(1.0)); sparsity is off for this
  # easy regime, so the baseline spreads over all signatures.
  alpha_0: 10.0

  # Generous mutation counts, de novo discovery needs signal.
  lam: 3000
  nb_dispersion: none

  # Easy regime: no sparsity, no dropout. Every signature active
  # everywhere, constant support down each tree.
  activity_sparsity: 0.0
  signature_dropout: 0.0

  # ── Signatures ────────────────────────────────────────────────────────────
  signatures:
    source: synthesize          # synthesize | load
    # correlation = 0.1 -> near-orthogonal, well-separated signatures.
    # This is the EASY setting: distinct signatures are simplest to
    # discover and to align unambiguously.
    correlation: 0.1
    path: ../COSMIC_sig/cosmic_signatures.csv   # used only when source == load
    num_signatures: 10          # K

  # ── Random phylogenetic forest ────────────────────────────────────────────
  forest:
    num_trees: 30
    min_leaves: 3
    max_leaves: 5
    min_branch_length: 2000
    max_branch_length: 5000

# ── Inference ───────────────────────────────────────────────────────────────
inference:
  # K is known for this stage. DeNovoHDP discovers this many signatures.
  num_signatures: 10

  data:
    count_matrix: ../data/config_denovo_easy_more_chains/mutation_count_matrix.csv
    newick_string: ../data/config_denovo_easy_more_chains/newick_string.nwk
    tree_edges: ../data/config_denovo_easy_more_chains/tree_edges.csv
    fixed_signatures: ../data/config_denovo_easy_more_chains/fixed_signatures.csv
    true_activities: ../data/config_denovo_easy_more_chains/true_activities.csv
    ground_truth_params: ../data/config_denovo_easy_more_chains/ground_truth_params.json

  priors:
    # Walk-scale prior (logistic-normal activity walk, unchanged from v2).
    sigma_prior: LogNorm
    sigma_prior_parm:
      mu: 0.0
      sigma: 1.0
    # Root-baseline std eta_root ~ Normal(0, sigma_0^2).
    sigma_0: 2.0
    # Signature prior S_k ~ Dir(beta * 1_96). Single shared concentration.
    # beta < 1 favours peaked signatures; beta = 1 is uniform-over-simplex.
    # 0.5 leans mildly toward structured signatures.
    beta: 0.5

  # NUTS sampler settings
  draws: 1000
  tune: 1000
  chains: 8
  cores: 8
  target_accept: 0.9
  max_treedepth: 10

  results_dir: ../results/