# Tiny end-to-end smoke config (fixed signatures, switch-plus-drift generator).
# Not a scientific run: two small trees, K = 3 catalogue signatures (one
# always-on pair plus one switching unit so on/off actually exercises), and a
# NUTS sampler small enough to finish in around a minute. Exercised by
# tests/test_smoke.py, which redirects the data/results paths below into a
# temp directory; run it manually the same way as any other config:
#
#   cd scripts
#   python generate_data.py --config ../configs/config_smoke.yaml
#   python run_inference.py --config ../configs/config_smoke.yaml
#   python recovery_vs_truth.py --trace ../results/smoke/trace.nc \
#       --true-activities ../data/smoke/true_activities.csv \
#       --newick ../data/smoke/newick_string.nwk \
#       --metrics cosine tv --outdir ../results/smoke/recovery

experiment_name: smoke
git_tag: switch-drift-v1

simulation:
  seed: 20240607 # matches tests/conftest.py's RNG_SEED
  results_dir: ../data/
  make_plots: false

  repertoire:
    source: cosmic
    path: ../COSMIC_sig/cosmic_signatures.csv
    signatures: [SBS1, SBS5, SBS36]

  switching:
    enabled: true
    branch_length_scaling: true
    units:
      - signatures: [SBS1] # clock: always on
        root_prob: 1.0
        lambda_on: 0.0
        lambda_off: 0.0
      - signatures: [SBS5] # clock: always on
        root_prob: 1.0
        lambda_on: 0.0
        lambda_off: 0.0
      - signatures: [SBS36] # the one switching unit
        root_prob: 0.3
        lambda_on: 0.6
        lambda_off: 0.3

  levels:
    enabled: true
    walk: dirichlet
    concentration: 50.0
    branch_length_scaling: true
    concentration_floor: 1.0
    root_concentration: 1.0
    activation_pseudocount: 0.02

  forest:
    n_trees: 2
    nodes_per_tree: [4, 8]
    depth: [2, 4]
    max_attempts: 200
    branch_lengths:
      distribution: lognormal
      params: { mu: 0.0, sigma: 0.6 }

  burden:
    mean: 300
    distribution: negbin
    dispersion: 2.0

  counts:
    model: dirichlet_multinomial
    kappa: 50.0

inference:
  model: fixed

  data:
    count_matrix: ../data/smoke/mutation_count_matrix.csv
    newick_string: ../data/smoke/newick_string.nwk
    tree_edges: ../data/smoke/tree_edges.csv
    fixed_signatures: ../data/smoke/fixed_signatures.csv
    true_activities: ../data/smoke/true_activities.csv
    ground_truth_params: ../data/smoke/ground_truth_params.json

  priors:
    sigma_prior: LogNorm
    sigma_prior_parm:
      mu: 0.0
      sigma: 1.0
    sigma_0: 1.0

  draws: 50
  tune: 100
  chains: 1
  cores: 1
  target_accept: 0.9
  max_treedepth: 10

  results_dir: ../results/
